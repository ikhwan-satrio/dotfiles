##### GENERAL #####
set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g repeat-time 300
set-option -g escape-time 0
setw -g mode-keys vi
set -g allow-passthrough on
set -g focus-events on
set -g renumber-windows on

# Proper color/terminfo support (fixes italics, undercurl, truecolor in nvim etc.)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

##### LEADER KEY #####
unbind C-b
set -g prefix C-a
bind C-a send-prefix

##### SPLIT SHORTCUTS #####
# -c keeps the new pane in the current pane's working directory
bind \\ split-window -h -c "#{pane_current_path}"
bind -  split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

##### RESIZE PANE (ALT + hjkl) #####
bind -n M-h resize-pane -L 5
bind -n M-l resize-pane -R 5
bind -n M-j resize-pane -D 5
bind -n M-k resize-pane -U 5

##### SWITCH PANE (CTRL + hjkl), vim-aware #####
# Passes Ctrl+hjkl through to vim/nvim when it's the process running in the
# pane, so pane navigation works seamlessly across tmux and vim splits.
# Requires the "vim-tmux-navigator" plugin inside vim/nvim for full round-trip.
is_vim="ps -o state=,comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

##### STATUS BAR #####
set-option -g status-position bottom
set-option -g status-style bg=colour234,fg=colour111
set-option -g status-interval 2
set-option -g status-justify centre
set -g status-left "#[fg=colour39,bg=colour234,bold] #S #[default]"
set -g status-right "#[fg=colour245,bg=colour234]  %Y-%m-%d #[fg=colour111]  %H:%M:%S #[fg=colour39] #{pane_current_command}"

##### WINDOW TITLES #####
setw -g window-status-format " #[fg=colour244]#I:#W#F "
setw -g window-status-current-format " #[bg=colour39,fg=black,bold] #I:#W#F "
setw -g window-status-style bg=colour234,fg=colour244
setw -g window-status-current-style bg=colour39,fg=black,bold

##### PANE BORDERS #####
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour39

##### MESSAGE STYLES #####
set -g message-style bg=colour234,fg=colour111
set -g message-command-style bg=colour234,fg=colour81
setw -g mode-style bg=colour236,fg=colour81

##### COPY MODE (VI) #####
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind-key -T copy-mode-vi 'C-y' send -X copy-pipe-and-cancel 'xclip -selection clipboard -in'
# Copy on mouse drag release too, not just keyboard selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'xclip -selection clipboard -in'

# NOTE: 'xclip' assumes Linux + X11. Swap the clipboard command above if needed:
#   Wayland : wl-copy
#   macOS   : pbcopy

##### SESSION #####
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"
bind s choose-tree
bind c new-window -c "#{pane_current_path}"
bind & kill-window
bind x kill-pane

##### STARTUP SPLASH #####
set -g display-panes-time 1000
set -g display-panes-colour colour111
set -g display-panes-active-colour colour39
