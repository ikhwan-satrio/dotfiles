"$schema" = 'https://starship.rs/config-schema.json'

format = """
[░▒▓](#a3aed2)\
[](bg:#769ff0 fg:#a3aed2)\
$shell$os$username\
$directory\
$golang\
$nodejs\
$python\
$bun\
$rust\
$java\
$php\
$c\
$cpp\
$lua\
$swift\
$zig\
$julia\
$perl\
$package\
$docker_context\
[](fg:#1a1e28)
on> ${custom.jj} $nix_shell
->$character"""

add_newline = true

# ============================================================================
# ZEN BLUE PINK THEME
# Blue: #7aa2f7 (soft blue), #2ac3de (cyan blue)
# Pink: #bb9af7 (lavender), #f7768e (pink red)
# Dark: #1a1b26 (bg), #24283b (lighter bg)
# ============================================================================

# Shell
[shell]
fish_indicator = 'fish'
zsh_indicator = 'zsh'
powershell_indicator = 'powershell'
bash_indicator = 'bash'
unknown_indicator = '?'
format = '[ /bin/$indicator ]($style)'
style = 'bg:#1a1b26 fg:#c0caf5 bold'
disabled = false

# OS
[os]
disabled = false
format = '[ $name $symbol ]($style)'
style = 'bg:#1a1b26 fg:#bb9af7 bold'
[os.symbols]
Alpaquita = "🔔"
Alpine = "🏔️"
Amazon = "🙂"
Android = "🤖"
Arch = "🎗️"
Artix = "🎗️"
CentOS = "💠"
Debian = "🌀"
DragonFly = "🐉"
Emscripten = "🔗"
EndeavourOS = "🚀"
Fedora = "🎩"
FreeBSD = "😈"
Garuda = "🦅"
Gentoo = "🗜️"
HardenedBSD = "🛡️"
Illumos = "🐦"
Linux = "🐧"
Mabox = "📦"
Macos = "🍎"
Manjaro = "🥭"
Mariner = "🌊"
MidnightBSD = "🌘"
Mint = "🌿"
NetBSD = "🚩"
NixOS = "❄️"
OpenBSD = "🐡"
OpenCloudOS = "☁️"
openEuler = "🦉"
openSUSE = "🦎"
OracleLinux = "🦴"
Pop = "🍭"
Raspbian = "🍓"
Redhat = "🎩"
RedHatEnterprise = "🎩"
Redox = "🧪"
Solus = "⛵"
SUSE = "🦎"
Ubuntu = "🎯"
Unknown = "❓"
Windows = "🪟"

# Username
[username]
style_user = 'bg:#1a1b26 fg:#2ac3de bold'
style_root = 'bg:#1a1b26 fg:#f7768e bold'
format = '[ $user ]($style)'
disabled = false
show_always = true

# Git Branch
[git_branch]
format = '[ $symbol$branch ]($style)'
symbol = '🌱 '
style = 'bg:#1a1b26 fg:#bb9af7 bold'

# Git Status
[git_status]
format = '[ $all_status ]($style)'
style = 'bg:#1a1b26 fg:#f7768e bold'

# JJ
[custom.jj]
command = "prompt"
format = "$output"
ignore_timeout = true
shell = ["starship-jj", "--ignore-working-copy", "starship"]
use_stdin = false
when = true

[golang]
symbol = '🐹 '
format = '[ via $symbol$version]($style)'
style = 'bg:#1a2535 fg:#2ac3de bold'

[nodejs]
symbol = '⬢ '
format = '[ via $symbol$version]($style)'
style = 'bg:#1a2530 fg:#73daca bold'

[python]
symbol = '🐍 '
format = '[ via $symbol$version]($style)'
style = 'bg:#1a2528 fg:#7dcfff bold'

[bun]
symbol = '🥟 '
format = '[ via $symbol$version]($style)'
style = 'bg:#1e2035 fg:#bb9af7 bold'

[rust]
symbol = '🦀 '
format = '[ via $symbol$version]($style)'
style = 'bg:#251e20 fg:#ff9e64 bold'

[java]
symbol = '☕ '
format = '[ via $symbol$version]($style)'
style = 'bg:#251a20 fg:#f7768e bold'

[php]
symbol = '🐘 '
format = '[ via $symbol$version]($style)'
style = 'bg:#201a25 fg:#c678dd bold'

[c]
symbol = ' '
format = '[ via $symbol$version]($style)'
style = 'bg:#1a1e25 fg:#7aa2f7 bold'

[cpp]
symbol = ' '
format = '[ via $symbol$version]($style)'
style = 'bg:#251a1a fg:#f7768e bold'

[lua]
symbol = '🌙 '
format = '[ via $symbol$version]($style)'
style = 'bg:#1a2025 fg:#7aa2f7 bold'

[swift]
symbol = '🐦 '
format = '[ via $symbol$version]($style)'
style = 'bg:#25201a fg:#ff9e64 bold'

[zig]
symbol = '↯ '
format = '[ via $symbol$version]($style)'
style = 'bg:#25251a fg:#e0af68 bold'

[julia]
symbol = 'ஃ '
format = '[ via $symbol$version]($style)'
style = 'bg:#201e25 fg:#bb9af7 bold'

[perl]
symbol = '🦪 '
format = '[ via $symbol$version]($style)'
style = 'bg:#1a2538 fg:#2ac3de bold'

[package]
symbol = '📦 '
format = '[ $symbol$version ]($style)'
style = 'bg:#1e2230 fg:#bb9af7 bold'
disabled = false

[docker_context]
symbol = '🐳 '
format = '[ $symbol$context ]($style)'
style = 'bg:#1a1e28 fg:#7aa2f7 bold'

# Directory & Nix Shell

[nix_shell]
impure_msg = '[impure shell](bold red)'
pure_msg = '[pure shell](bold green)'
unknown_msg = '[unknown shell](bold yellow)'
format = '[☃️ $state( \($name\))](bold blue) '

[directory]
format = '[\[$path$read_only\]]($style)' 
style = 'bg:#1e2030 fg:#bb9af7 bold'
truncation_length = 3
truncate_to_repo = false

[character]
success_symbol = ' [󰘧](bold #bb9af7)'
error_symbol = ' [✗](bold #f7768e)'
